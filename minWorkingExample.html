<!DOCTYPE html>
<html lang="en">
  <style>
.image-container {
  position: relative;
  display: inline-block;
  border: 2px solid red;
}

.image-container img {
  display: block;
  width: 100%;
}

.overlay {
  position: absolute;
  top: 20px;
  left: 20px;

  color: white;
  background: rgba(0, 0, 0, 0.5);
  padding: 10px;
}
  </style>
  <body>
<div class="image-container">
  <img src="resources/aim.svg" alt="Example">
  <div class="overlay">
    Hello on top of image
  </div>
</div>
  </body>
</html>
